name: Update follower counts

on:
  schedule:
    - cron: "17 11 * * *" # daily, early morning in New York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: scripts/followers
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Fetch follower counts
        working-directory: scripts/followers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node update.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/followers.json; then
            echo "Follower counts unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/followers.json
          git commit -m "Update follower counts"
          git push
